name: Build public download release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-conmine-pack
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish verified JAR assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py
